function reconcile(v){let rows=getGenerated(v);for(let [k,o] of Object.entries(v.overlays)){if(!rows[k]){if(o.adjusted==null)delete v.overlays[k];else {o.checked=false;o.orphan=true;}}else {if(o.orphan)o.checked=false;o.orphan=false;o.name=rows[k].name;o.base=rows[k].q;}}}

function performMove(i,confirm=false){let v=w();if(!v||!editable()||moveSource===null||moveSource===i){moveSource=null;render();return;}let a=v.slots[moveSource],b=v.slots[i];if(b.state==='skipped'&&!confirm){openModal({type:'confirm',title:'Destinació omesa',text:'Aquest àpat està omès. Vols substituir l’omissió?',action:'confirmMove',arg:i,label:'Mou el plat'});return;}if(JSON.stringify(a)===JSON.stringify(b)){moveSource=null;closeModal();render();return;}v.undo={source:moveSource,dest:i,beforeA:clone(a),beforeB:clone(b)};v.slots[i]=clone(a);v.slots[moveSource]=b.state==='selected'?clone(b):{state:'pending'};moveSource=null;reconcile(v);closeModal();note('Canvi desat');render();}
function performUndo(){let v=w();if(!v?.undo||!editable())return;let u=v.undo;v.slots[u.source]=u.beforeA;v.slots[u.dest]=u.beforeB;v.undo=null;reconcile(v);note('Canvi desfet');render();}
function propagate(id,kind){let d=dishBy(id);for(let [k,v] of Object.entries(S.weeks))if(k>=TODAY){let changed=[];v.slots.forEach((sl,i)=>{if(sl.state==='selected'&&sl.dish.id===id){let next=clone(d);if(kind==='recipe'&&JSON.stringify(effective(sl.dish))===JSON.stringify(effective(next))&&status(sl.dish)===status(next))return;sl.dish=next;changed.push(i);}});if(v.undo&&changed.some(i=>i===v.undo.source||i===v.undo.dest))v.undo=null;reconcile(v);}}
function latest(id){let dates=[];for(let [k,v] of Object.entries(S.weeks))v.slots.forEach((sl,i)=>{if(sl.state==='selected'&&sl.dish.id===id)dates.push(addDays(k,Math.floor(i/2)))});return dates.sort().at(-1)||'';}
function candidates(m){let cat=m.category,q=searchText(m.q);let all=S.dishes.filter(d=>!d.archived&&(!cat||[d.primary,...d.secondary].includes(cat))&&searchText(d.name).includes(q));let expected=m.i%2?'dinner':'lunch';return all.sort((a,b)=>Number(a.special)-Number(b.special)||Number(a.pref!=='both'&&a.pref!==expected)-Number(b.pref!=='both'&&b.pref!==expected)||latest(a.id).localeCompare(latest(b.id))||a.id-b.id);}
const button=(label,action,arg='',cls='',extra='')=>`<button type="button" class="${cls}" data-act="${action}" data-arg="${esc(arg)}" ${extra}>${label}</button>`;
const navItems=[['menu','Menú setmanal','Menú'],['catalogue','Plats','Plats'],['template','Plantilla','Plantilla'],['shopping','Llista de la compra','Compra']];
function nav(mobile=false){return navItems.map(([k,t,short])=>button(mobile?short:t,'nav',k,'nav-btn '+(page===k?'active':''),page===k?'aria-current="page"':'')).join('')}
const notice=(text,type='success',action='')=>`<div class="notice ${type}" role="${type==='error'?'alert':'status'}"><span style="flex:1">${text}</span>${action}</div>`;
function header(title,subtitle='',actions=''){return `<header class="app-header"><div><h1>${title}</h1>${subtitle?`<p class="small" style="margin-top:4px">${subtitle}</p>`:''}</div>${actions}</header>`;}
function weekTools(){return `<div class="week-tools">${button('‹','week',-1,'arrow','aria-label="Setmana anterior"')}<span class="week-range">${esc(range(week))}</span>${button('›','week',1,'arrow','aria-label="Setmana següent"')}${button('Avui','today','','quiet')}</div>`;}
function grid(isTemplate=false){let v=w();return `<div class="weekly-grid" aria-label="Set dies, dinar i sopar">${days.map((day,d)=>`<div class="day-col"><div class="day-head ${!isTemplate&&week===TODAY&&d===2?'today':''}"><span class="day-full">${esc(day)}</span>${isTemplate?'':`<small>${fmt(addDays(week,d),{day:'numeric',month:'short'})}</small>`}</div>${[2*d,2*d+1].map(i=>{let sl=v?.slots[i]||{state:'pending'},suggestion=isTemplate?S.template[i]:v?.suggestions[i]??null,name=isTemplate?(suggestion||'Lliure'):sl.state==='selected'?sl.dish.name:sl.state==='skipped'?'Omès':v?'+ Tria un plat':'Pendent';let hint=isTemplate?'':sl.state==='selected'?(suggestion?'Sug.: '+suggestion:'Lliure'):sl.state==='skipped'?(suggestion?'Sug.: '+suggestion:'Sense àpat'):suggestion||'Lliure';let cls=isTemplate?'template-card':sl.state;let enabled=isTemplate||!!v&&(editable()||sl.state==='selected');let full=`${pos(i)}: ${name}${hint?' · '+hint:''}`;return `<button type="button" class="meal ${cls} ${moveSource===i?'origin':moveSource!==null?'dest':''}" data-act="${isTemplate?'templateSlot':'slot'}" data-arg="${i}" ${!enabled?'disabled':''} title="${esc(full)}" aria-label="${esc(full)}"><span class="meal-type ${i%2?'dinner':''}">${meal(i)}</span><span class="meal-name">${esc(name)}</span><span class="meal-hint">${esc(hint)}</span></button>`}).join('')}</div>`).join('')}</div>`;}
function renderMenu(){let v=w();let bits=header('Menú setmanal',week<TODAY?'Setmana passada · només consulta':week===TODAY?'Setmana actual':'Setmana futura',weekTools());if(toast)bits+=notice(esc(toast),toastType);if(moveSource!==null)bits+=notice(`Tria la destinació · ${esc(pos(moveSource))}`,'info',button('Cancel·la','cancelMove','','quiet'));else if(v?.undo&&editable())bits+=notice('Pots desfer l’últim moviment o intercanvi.','success',button('Desfés','undo','','quiet'));if(!v){bits+=notice(editable()?'Encara no s’ha creat el menú d’aquesta setmana.':'No hi ha cap menú per a aquesta setmana.',editable()?'info':'warning',editable()?button('Crea el menú','createWeek','','primary'):'');}bits+=grid();let n=v?.slots.filter(s=>s.state==='selected').length||0,sk=v?.slots.filter(s=>s.state==='skipped').length||0;bits+=`<div class="menu-footer"><span class="small">${n} de 14 àpats planificats${sk?` · ${sk} àpats omesos`:''}</span>${button('Llista de la compra','nav','shopping','quiet')}</div>`;return bits;}
function renderTemplate(){return header('Plantilla setmanal','Categories suggerides · una sola plantilla')+(toast?notice(esc(toast),toastType):'')+notice('La plantilla orienta la tria. Els menús ja creats no canvien quan l’edites.','info')+grid(true)+`<p class="small">Toca un àpat per canviar-ne la categoria o deixar-lo lliure.</p>`;}
function options(vals,current,empty=''){return (empty?`<option value="" ${!current?'selected':''}>${esc(empty)}</option>`:'')+vals.map(x=>`<option ${x===current?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('');}
function dishRow(d,action,showStatus=true){return `<button class="list-row" data-act="${action}" data-arg="${d.id}"><div style="flex:1"><div class="item-title">${esc(d.name)}</div><span class="small">${esc(catText(d))} · ${prefText(d.pref)}</span><div class="row" style="margin-top:5px">${d.special?'<span class="pill warn">Ocasió especial</span>':''}${showStatus?`<span class="badge-text">${status(d)}</span>`:''}</div></div><span class="chevron" aria-hidden="true">›</span></button>`;}
function catalogueResults(){let q=searchText(catQuery),rows=S.dishes.filter(d=>d.archived===showArchived&&(!catFilter||[d.primary,...d.secondary].includes(catFilter))&&searchText(d.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ca')||a.id-b.id);return `<p class="small">${rows.length} ${rows.length===1?'plat':'plats'}</p>`+(rows.length?`<div class="list">${rows.map(d=>dishRow(d,'dishDetail')).join('')}</div>`:`<div class="empty"><h2>${showArchived&&!q&&!catFilter?'No hi ha plats arxivats':'No s’han trobat plats'}</h2><p>Canvia la cerca o els filtres per continuar.</p>${button(showArchived&&!q&&!catFilter?'Plats actius':'Neteja els filtres',showArchived&&!q&&!catFilter?'archiveTab':'clearCatalog',showArchived&&!q&&!catFilter?'0':'')}</div>`);}
function renderCatalogue(){return header('Plats','Catàleg familiar',button('Nou plat','newDish','','primary'))+(toast?notice(esc(toast),toastType):'')+`<div class="tabline">${button('Actius','archiveTab','0',!showArchived?'active':'')}${button('Arxivats','archiveTab','1',showArchived?'active':'')}</div><div class="app-toolbar"><div class="field"><label for="catalog-q">Cerca un plat</label><input id="catalog-q" value="${esc(catQuery)}" placeholder="Nom del plat"></div><div class="field"><label for="catalog-cat">Categoria</label><select id="catalog-cat">${options(cats,catFilter,'Totes les categories')}</select></div></div><div class="collection" id="catalog-results">${catalogueResults()}</div>`;}
function shoppingRow(r,o,manual=false){let checked=manual?r.checked:o?.checked;let q=manual?r.q:o?.adjusted??r.q;let key=manual?r.id:r.key;let quantity=manual&&q==null?'Sense quantitat':amt(q,r.unit);let checkbox=`<input type="checkbox" aria-label="${esc('Comprat: '+r.name)}" data-check="${manual?'manual':'generated'}" data-key="${esc(key)}" ${checked?'checked':''} ${editable()?'':'disabled'}>`;let detail=manual?'Manual':o?.adjusted!=null?`Calculat: ${amt(r.q,r.unit)} · Ajustat`:r.unit==='taste'?'Sense quantitat numèrica':'';return `<div class="shop-row ${checked?'checked':''}">${checkbox}<div style="flex:1"><div class="item-title">${esc(r.name)}</div>${detail?`<div class="small">${esc(detail)}</div>`:''}</div><span class="quantity">${esc(quantity)}</span>${editable()?(manual?button('Edita','editManual',key,'quiet'):r.unit==='taste'?'':button('Ajusta','adjust',key,'quiet')):''}</div>`;}
function renderShopping(){let v=w();let bits=header('Llista de la compra',editable()?'Quantitats per a 2 adults':'Setmana passada · només consulta',weekTools());if(toast)bits+=notice(esc(toast),toastType);if(!v)return bits+`<div class="empty"><h2>No hi ha cap menú per a aquesta setmana</h2><p>${editable()?'Crea primer el menú per generar la compra o afegir productes.':'Aquesta setmana no té dades desades.'}</p>${button('Ves al menú','nav','menu','primary')}</div>`;let pending=v.slots.filter(s=>s.state==='pending').length;let missing=v.slots.map((s,i)=>({s,i})).filter(({s})=>s.state==='selected'&&!s.dish.published);if(pending||missing.length)bits+=`<div class="notice warning" style="display:block"><strong>Compra incompleta</strong><p>${pending?`${pending} àpats pendents de planificar. `:''}${missing.length?`${missing.length} ${missing.length===1?'àpat té':'àpats tenen'} recepta pendent o provisional.`:''}</p>${missing.length?`<details style="margin-top:5px"><summary>Vegeu els àpats afectats</summary><ul style="padding-left:20px;margin:6px 0">${missing.map(({s,i})=>`<li>${esc(pos(i))} — ${esc(s.dish.name)} (${s.dish.draft?'esborrany':'pendent'})</li>`).join('')}</ul></details>`:''}</div>`;let rows=Object.values(getGenerated(v)).sort((a,b)=>compareText(ingredientKey(a.name),ingredientKey(b.name))||['g','ml','unit','taste'].indexOf(a.unit)-['g','ml','unit','taste'].indexOf(b.unit));let orphans=Object.entries(v.overlays).filter(([k,o])=>!getGenerated(v)[k]&&o.adjusted!=null);bits+=`<div class="shop-grid"><section class="shop-section"><div class="row between"><h2>Ingredients del menú</h2><span class="small">${rows.length} files</span></div>${rows.length?rows.map(r=>shoppingRow(r,v.overlays[r.key])).join(''):`<div class="empty"><h3>No hi ha ingredients calculats</h3><p>${pending?'Completa el menú o les receptes.':'No hi ha àpats amb ingredients calculats.'}</p></div>`}</section><section class="shop-section"><div class="row between"><h2>Productes manuals</h2>${editable()?button('Afegeix un producte','addManual','','primary'):''}</div>${v.manual.length?v.manual.map(r=>shoppingRow(r,null,true)).join(''):`<p class="small">No hi ha productes manuals.</p>`}${orphans.length?`<div class="panel stack"><h3>Ajustos pendents de revisar</h3><p class="small">L’ingredient ja no és al menú. L’ajust es conserva fins que el descarts o torni a aparèixer.</p>${orphans.map(([k,o])=>`<div class="shop-row"><div style="flex:1"><strong>${esc(o.name)}</strong><p class="small">Ajust anterior: ${amt(o.adjusted,k.split('|').at(-1))}</p></div>${editable()?button('Descarta','discardOrphan',k,'danger'):''}</div>`).join('')}</div>`:''}</section></div>`;return bits;}
function renderSystem(){let states={offline:['No es pot connectar amb el servidor','Comprova la connexió. Si has enviat un canvi, comprova si s’ha desat abans de repetir-lo.'],loading:['Carregant el menú','S’estan consultant les dades.'],notFound:['No s’ha trobat el plat','Pot ser que ja no estigui disponible.'],pastError:['Aquesta setmana és de només consulta','Els menús passats no es poden modificar.']};let [a,b]=states[systemState]||states.offline;return header('Menú familiar')+`<div class="center-state">${systemState==='loading'?'<div class="loadingbar"></div>':''}<h2>${a}</h2><p>${b}</p>${button(systemState==='notFound'?'Torna al catàleg':systemState==='loading'?'Mostra el resultat':'Torna-ho a provar','recoverSystem','','primary')}</div>`;}
function render(){let key=document.activeElement?.dataset;let content=systemState?renderSystem():page==='menu'?renderMenu():page==='template'?renderTemplate():page==='catalogue'?renderCatalogue():renderShopping();$('#root').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="wordmark">menú<span>.</span><br>familiar</div><nav aria-label="Navegació principal">${nav()}</nav><div class="demo-label">Dades fictícies<br>Prototip V1</div></aside><main class="app-main" id="app-main">${content}</main><nav class="bottom-nav" aria-label="Navegació principal">${nav(true)}</nav></div>`;renderModal();if(!modal&&key?.act)focusMain(key);}
function openModal(m){if(!modal){let trigger=document.activeElement?.dataset;modalReturnFocus=trigger?.act?{act:trigger.act,arg:trigger.arg}:null;}modal=m;renderModal(true);}
function focusMain(hint){let target=hint&&$$('#root [data-act]').find(e=>e.dataset.act===hint.act&&e.dataset.arg===hint.arg&&!e.disabled&&e.getClientRects().length);if(!target){target=$('#app-main h1');target?.setAttribute('tabindex','-1');}target?.focus();}

function picker(i,replace=false){let suggested=w().suggestions[i];openModal({type:'picker',i,replace,suggested,category:suggested||'',q:''});}

function recipeView(d,historical=false){let r=effective(d);return `<div class="row between"><span class="pill ${d.published?'':'warn'}">${status(d)}</span><span class="small">Per a 2 adults</span></div>${d.published&&d.draft&&!historical?notice('Hi ha canvis encara no publicats. Es mostra la recepta efectiva.','info'):''}${!r?`<div class="empty"><h3>Recepta pendent</h3><p>Encara no s’han indicat els ingredients ni la preparació.</p></div>`:`${!d.published?notice('Recepta provisional · informació incompleta.','warning'):''}<div class="detail-grid"><section class="panel stack"><h3>Ingredients</h3>${r.ingredients.length?r.ingredients.map(l=>`<div class="ingredient-view"><div><strong>${esc(l.name)}</strong>${l.note?`<div class="small">${esc(l.note)}</div>`:''}</div><span>${esc(!l.taste&&l.q==null?'Quantitat pendent'+(l.unit?' ('+unitLabel(l.unit)+')':''):amt(l.q,l.unit))}</span></div>`).join(''):'<p class="small">Sense ingredients desats.</p>'}</section><section class="panel stack"><h3>Preparació</h3><p class="longtext">${esc(r.prep||'Preparació pendent.')}</p></section></div>`}`;}

function readDishForm(){let d=modal.data;return {...d,name:$('#dish-name').value,primary:$('#dish-primary').value,secondary:$$('input[name=secondary]:checked').map(e=>e.value),pref:$('#dish-pref').value,special:$('#dish-special').checked};}
function recipeForm(m){let r=m.data;return `${m.banner?notice(esc(m.banner),'error',m.conflict&&!m.reviewed?button('Revisa la versió actual','reviewRecipe','','quiet'):''):''}${m.reviewed?conflictComparison(m):''}${m.slot!=null?notice('Els canvis afecten la recepta compartida.','info'):''}${m.errors?.publish?notice(esc(m.errors.publish),'error'):''}<p class="small">Per a 2 adults · Pots deixar la quantitat pendent a l’esborrany.</p>${dishBy(m.id)?.published?notice('Els canvis d’esborrany no modificaran la recepta publicada fins que els publiquis.','info'):''}<form id="recipe-form" novalidate><div class="field"><label for="prep">Preparació</label><textarea id="prep" maxlength="10000" placeholder="Escriu els passos de la recepta">${esc(r.prep)}</textarea></div><div class="row between"><h3>Ingredients</h3>${button('Afegeix un ingredient','addIngredient','','quiet')}</div>${r.ingredients.length?r.ingredients.map((l,i)=>`<div class="recipe-line" data-line="${i}"><div class="row between"><strong>Ingredient ${i+1}</strong>${button('Retira','removeIngredient',i,'quiet')}</div>${field('Nom','ing-name-'+i,l.name,'maxlength="120"')}<div class="amounts">${field('Quantitat','ing-q-'+i,l.q??'',`inputmode="decimal" ${l.taste?'disabled':''} ${m.errors?.['q'+i]?'class="invalid" aria-invalid="true"':''}`)}<div class="field"><label for="ing-unit-${i}">Unitat</label><select id="ing-unit-${i}" ${l.taste?'disabled':''}>${['','g','kg','ml','l','unit'].map(u=>`<option value="${u}" ${u===(l.unit||'')?'selected':''}>${u?unitLabel(u):'Tria una unitat'}</option>`).join('')}</select></div></div><label class="checkbox-line"><input type="checkbox" id="ing-taste-${i}" data-taste="${i}" ${l.taste?'checked':''}>Al gust</label>${field('Nota (opcional)','ing-note-'+i,l.note,'maxlength="500"')}${validation(m,'q'+i)}${validation(m,'name'+i)}</div>`).join(''):'<p class="small">Encara no hi ha ingredients.</p>'}</form>`;}
function conflictComparison(m){return `<section class="panel stack"><h3>Versió desada actualment</h3><p class="longtext">${esc(m.reviewed.prep||'Preparació pendent.')}</p><ul>${m.reviewed.ingredients.map(l=>`<li>${esc(l.name)} · ${esc(l.taste?'Al gust':l.q==null?'Quantitat pendent':amt(l.q,l.unit))}</li>`).join('')}</ul><p>Compara aquesta versió amb els teus canvis al formulari.</p>${button('He revisat els canvis','ackRecipe','','quiet')}</section>`;}

const parseQuantity=(v,limit=999999999999n)=>{let raw=String(v).trim();if(!/^\d{1,16}([,.]\d{1,3})?$/.test(raw))return null;let q=toMilli(raw);return q>0n&&q<=limit?fromMilli(q):null;};
function manualForm(m){let d=m.data;return `${m.banner?notice(esc(m.banner),'error'):''}<form id="manual-form" novalidate>${field('Producte','manual-name',d.name,'maxlength="120"')}${validation(m,'name')}<div class="form-grid">${field('Quantitat (opcional)','manual-q',d.q??'','inputmode="decimal"')}<div class="field"><label for="manual-unit">Unitat</label><select id="manual-unit">${['','g','kg','ml','l','unit'].map(u=>`<option value="${u}" ${u===(d.unit||'')?'selected':''}>${u?unitLabel(u):'Sense unitat'}</option>`).join('')}</select></div></div>${validation(m,'q')}<p class="small">Indica la quantitat i la unitat juntes, o deixa totes dues buides.</p></form>`;}
function renderModal(focus=false){$('#root').inert=!!modal;if(!modal){$('#modal-root').innerHTML='';return;}let m=modal,body='',footer='',title='',sub='',wide=false;
 switch(m.type){
 case 'picker':title=m.replace?'Canvia el plat':'Tria un plat';sub=pos(m.i);body=`${m.suggested?`<p class="small">Suggeriments: <strong>${esc(m.suggested)}</strong></p>`:''}<div class="app-toolbar"><div class="field"><label for="picker-q">Cerca un plat</label><input id="picker-q" value="${esc(m.q)}" placeholder="Nom del plat"></div><div class="field"><label for="picker-cat">Categoria</label><select id="picker-cat">${options(cats,m.category,'Totes les categories')}</select></div></div><div class="row">${button('Mostra tots els plats','showAll','','quiet')}</div><div class="collection" id="picker-results">${pickerResults()}</div>`;footer=(!m.replace?button('Omet aquest àpat','skip',m.i,'quiet'):'')+button('Cancel·la','close','','quiet');break;

function requestClose(){if(modal?.type==='recipeForm'){let m={...modal,data:readRecipeForm()};if(JSON.stringify(m.data)!==JSON.stringify(m.initial)){openModal({type:'dirty',previous:m});return;}}closeModal();}
function openRecipe(id,slot=null){let d=dishBy(id),data=clone(d.draft||d.published||{prep:'',ingredients:[]});data.ingredients=data.ingredients.map(l=>({...l,q:l.q===null?null:String(l.q)}));openModal({type:'recipeForm',id,slot,data,initial:clone(data),errors:{}});}
function openDishForm(id){let d=id?dishBy(id):{name:'',primary:'',secondary:[],pref:'both',special:false};openModal({type:'dishForm',id:id||null,data:clone(d),errors:{}});}
function confirm(title,text,action,arg,label,danger=false,back=null){openModal({type:'confirm',title,text,action,arg,label,danger,back});}
function saveRecipe(publish){let m=modal,d=readRecipeForm();m.data=d;m.errors={};
 if(m.slot!=null&&(!editable()||w()?.slots[m.slot]?.dish?.id!==m.id)){m.banner='L’àpat ha canviat o ja és de només consulta.';renderModal();return;}
 if(m.conflict){m.banner='La recepta ha canviat. Revisa la versió desada abans de tornar a enviar el formulari.';renderModal();return;}
 if(m.fail){m.banner='No s’ha pogut desar. Les dades del formulari es conserven. Torna-ho a provar.';m.fail=false;renderModal();return;}
 d.ingredients=d.ingredients.filter(l=>l.name.trim()||String(l.q??'').trim()||l.unit||l.taste||l.note.trim());
 if(d.ingredients.length>100)m.errors.publish='La recepta admet un màxim de 100 ingredients.';
 for(let [i,l] of d.ingredients.entries()){let hasQuantity=String(l.q??'').trim()!=='';if(!l.name.trim())m.errors['name'+i]='Introdueix el nom de l’ingredient.';if(!l.taste&&hasQuantity&&(parseQuantity(l.q)===null||!l.unit))m.errors['q'+i]='Indica una quantitat positiva i una unitat.';if(publish&&!l.taste&&!hasQuantity)m.errors['q'+i]='Indica la quantitat o marca Al gust.';}
 if(publish&&(!d.prep.trim()||!d.ingredients.length))m.errors.publish='Per publicar, cal una preparació i almenys un ingredient.';
 if(Object.keys(m.errors).length){renderModal(true);return;}
 d.ingredients=d.ingredients.map(l=>({...l,name:l.name.trim(),q:l.taste?null:parseQuantity(l.q)}));let target=dishBy(m.id);if(publish){target.published=clone(d);target.draft=null;}else target.draft=clone(d);propagate(target.id,'recipe');closeModal();note(publish?'Recepta publicada':'Esborrany desat');render();openModal(m.slot==null?{type:'dish',id:target.id}:{type:'slot',i:m.slot});}
function act(a,arg){const n=Number(arg);let m=modal;switch(a){
 case 'nav':if(modal){requestClose();if(modal)return;}page=arg;systemState=null;moveSource=null;resetNotice();render();break;
 case 'week':week=addDays(week,n*7);moveSource=null;resetNotice();render();break;
 case 'today':week=TODAY;moveSource=null;resetNotice();render();break;
 case 'createWeek':ensureWeek();note('Menú creat');render();break;
 case 'slot':{if(moveSource!==null){if(w().slots[n].state==='skipped')confirm('Destinació omesa','Aquest àpat està omès. Vols substituir l’omissió?','confirmMove',n,'Mou el plat');else performMove(n);break;}let sl=w()?.slots[n];if(!sl)break;if(sl.state==='selected')openModal({type:'slot',i:n});else if(editable()&&sl.state==='pending')picker(n);else if(editable()&&sl.state==='skipped')openModal({type:'skipped',i:n});break;}
 case 'replacePicker':picker(n,true);break;
 case 'pick':{if(!editable()||!w()||!dishBy(n)||dishBy(n).archived||m?.type!=='picker')break;let i=m.i;let old=w().slots[i];if(old.state!==(m.replace?'selected':'pending'))break;if(old.state==='selected'&&old.dish.id===n){closeModal();break;}changeSlot(i,selected(n));closeModal();note('Plat desat');render();break;}
 case 'showAll':m.category='';$('#picker-cat').value='';$('#picker-results').innerHTML=pickerResults();break;
 case 'clearPicker':m.q='';m.category='';$('#picker-q').value='';$('#picker-cat').value='';$('#picker-results').innerHTML=pickerResults();break;
 case 'close':requestClose();break;
 case 'cancelConfirm':{let back=m.back;if(back){modal=back;renderModal(true);}else{closeModal();render();}break;}
 case 'remove':confirm('Retira el plat','L’àpat tornarà a estar pendent.','confirmRemove',n,'Retira el plat',true,clone(m));break;
 case 'confirmRemove':changeSlot(n,{state:'pending'});closeModal();note('Plat retirat');render();break;
 case 'skip':if(w().slots[n].state==='selected'){confirm('Omet aquest àpat','Es retirarà el plat seleccionat i l’àpat quedarà omès.','confirmSkip',n,'Omet l’àpat',true,clone(m));}else{changeSlot(n,{state:'skipped'});closeModal();note('Àpat omès');render();}break;
 case 'confirmSkip':changeSlot(n,{state:'skipped'});closeModal();note('Àpat omès');render();break;
 case 'reactivate':changeSlot(m.i,{state:'pending'});closeModal();note('Àpat pendent');render();break;
 case 'startMove':moveSource=n;closeModal();resetNotice();render();break;
 case 'confirmMove':performMove(n,true);break;
 case 'cancelMove':moveSource=null;resetNotice();render();break;
 case 'undo':performUndo();break;
 case 'templateSlot':openModal({type:'template',i:n,value:S.template[n]||''});break;
 case 'saveTemplate':S.template[m.i]=$('#template-cat').value||null;closeModal();note('Plantilla actualitzada');render();break;
 case 'archiveTab':showArchived=arg==='1';catQuery='';catFilter='';resetNotice();render();break;
 case 'clearCatalog':catQuery='';catFilter='';render();break;
 case 'dishDetail':resetNotice();openModal({type:'dish',id:n});break;
 case 'newDish':openDishForm(null);break;
 case 'editDish':openDishForm(n);break;
 case 'saveDish':{let d=readDishForm();m.data=d;m.errors={};if(!d.name.trim())m.errors.name='Introdueix el nom del plat.';if(!d.primary)m.errors.primary='Tria una categoria principal.';if(d.secondary.includes(d.primary))m.errors.secondary='La categoria principal no es pot repetir.';if(Object.keys(m.errors).length){renderModal();break;}d.name=d.name.trim();if(m.id){Object.assign(dishBy(m.id),d);propagate(m.id,'dish');}else{d={...d,id:S.nextDish++,archived:false,published:null,draft:null};S.dishes.push(d);}closeModal();note('Plat desat');render();openModal({type:'dish',id:d.id});break;}
 case 'archive':confirm('Arxiva el plat','El plat deixarà d’aparèixer al selector. Els menús on ja està assignat es conservaran.','confirmArchive',n,'Arxiva el plat',true,clone(m));break;
 case 'restore':confirm('Restaura el plat','El plat tornarà a estar disponible per planificar.','confirmRestore',n,'Restaura el plat',false,clone(m));break;
 case 'confirmArchive':dishBy(n).archived=true;closeModal();note('Plat arxivat');render();break;
 case 'confirmRestore':dishBy(n).archived=false;showArchived=false;catQuery='';catFilter='';closeModal();note('Plat restaurat');render();break;
 case 'editRecipe':openRecipe(n);break;
 case 'editSlotRecipe':if(editable()&&w()?.slots[n]?.state==='selected')openRecipe(w().slots[n].dish.id,n);break;
 case 'addIngredient':m.data=readRecipeForm();m.data.ingredients.push({name:'',q:'',unit:'',taste:false,note:''});m.errors={};renderModal();$('#ing-name-'+(m.data.ingredients.length-1))?.focus();break;
 case 'removeIngredient':m.data=readRecipeForm();m.data.ingredients.splice(n,1);m.errors={};renderModal();break;
 case 'saveDraft':saveRecipe(false);break;
 case 'publish':saveRecipe(true);break;
 case 'continueEdit':modal=m.previous;renderModal(true);break;
 case 'discardEdit':{let id=m.previous?.id;closeModal();if(id)openModal({type:'dish',id});break;}
 case 'reviewRecipe':{m.data=readRecipeForm();m.reviewed=clone(dishBy(m.id).draft||effective(dishBy(m.id)));renderModal(true);break;}
 case 'ackRecipe':{if(!m.reviewed)break;m.data=readRecipeForm();m.reviewed=null;m.conflict=false;m.banner='';m.errors={};renderModal(true);break;}
 case 'addManual':if(w()&&editable())openModal({type:'manual',id:null,data:{name:'',q:null,unit:''},errors:{}});break;
 case 'editManual':{let item=w()?.manual.find(x=>x.id===n);if(item&&editable())openModal({type:'manual',id:n,data:clone(item),errors:{}});break;}
 case 'saveManual':{let d={...m.data,name:$('#manual-name').value,q:$('#manual-q').value,unit:$('#manual-unit').value};m.data=d;m.errors={};if(!d.name.trim())m.errors.name='Introdueix el nom del producte.';let blank=d.q.trim()==='';if((blank&&d.unit)||(!blank&&(!d.unit||parseQuantity(d.q)===null)))m.errors.q='Indica una quantitat positiva i una unitat, o deixa-les buides.';if(Object.keys(m.errors).length){renderModal();break;}d.name=d.name.trim();d.q=blank?null:parseQuantity(d.q);if(m.id)Object.assign(w().manual.find(x=>x.id===m.id),d);else w().manual.push({...d,id:S.nextManual++,checked:false});closeModal();note('Producte desat');render();break;}
 case 'removeManual':m.data={...m.data,name:$('#manual-name').value,q:$('#manual-q').value,unit:$('#manual-unit').value};confirm('Elimina el producte manual','Només s’eliminarà aquest producte manual.','confirmRemoveManual',n,'Elimina',true,clone(m));break;
 case 'confirmRemoveManual':w().manual=w().manual.filter(x=>x.id!==n);closeModal();note('Producte eliminat');render();break;
 case 'adjust':{let r=getGenerated()[arg];if(r&&r.unit!=='taste'&&editable())openModal({type:'adjust',key:arg,value:w().overlays[arg]?.adjusted??r.q,errors:{}});break;}
 case 'saveAdjust':{m.value=$('#adjust-q').value;let v=parseQuantity(m.value,1399999999998600000n);if(v===null){m.errors={q:'La quantitat ha de ser positiva.'};renderModal();break;}let r=getGenerated()[m.key];let o=w().overlays[m.key]||{checked:false};w().overlays[m.key]={...o,name:r.name,base:r.q,adjusted:toMilli(v)===toMilli(r.q)?null:v,orphan:false};closeModal();note('Quantitat ajustada');render();break;}
 case 'resetAdjust':{if(modal)closeModal();let o=w().overlays[arg];if(o){o.adjusted=null;if(!o.checked)delete w().overlays[arg];}note('Quantitat restablerta');render();break;}
 case 'discardOrphan':confirm('Descarta l’ajust','L’ajust anterior s’eliminarà. Aquesta acció no modifica cap recepta.','confirmOrphan',arg,'Descarta',true);break;
 case 'confirmOrphan':delete w().overlays[arg];closeModal();note('Ajust descartat');render();break;
 case 'recoverSystem':if(systemState==='notFound')page='catalogue';if(systemState==='pastError'){page='menu';week=PAST;}systemState=null;resetNotice();render();break;
}}

 case 'offline':case 'loading':case 'notFound':case 'pastError':systemState=which;break;
 }}
function appMode(scenario){let entry=SCENARIOS.find(s=>s.id===scenario);setup(entry?.setup||'menu');render();document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();act(b.dataset.act,b.dataset.arg||'');}});document.addEventListener('input',e=>{if(e.target.id==='picker-q'){modal.q=e.target.value;$('#picker-results').innerHTML=pickerResults();}if(e.target.id==='catalog-q'){catQuery=e.target.value;$('#catalog-results').innerHTML=catalogueResults();}});document.addEventListener('change',e=>{let t=e.target;if(t.id==='picker-cat'){modal.category=t.value;$('#picker-results').innerHTML=pickerResults();}if(t.id==='catalog-cat'){catFilter=t.value;$('#catalog-results').innerHTML=catalogueResults();}if(t.dataset.taste!==undefined){let i=t.dataset.taste;$('#ing-q-'+i).disabled=t.checked;$('#ing-unit-'+i).disabled=t.checked;if(t.checked){$('#ing-q-'+i).value='';$('#ing-unit-'+i).value='';}}if(t.dataset.check&&editable()&&w()){let k=t.dataset.key;if(t.dataset.check==='manual'){let r=w().manual.find(x=>x.id===Number(k));if(r)r.checked=t.checked;}else{let r=getGenerated()[k],o=w().overlays[k]||{name:r.name,base:r.q,adjusted:null};o.checked=t.checked;w().overlays[k]=o;}let scroll=$('#app-main').scrollTop;render();$('#app-main').scrollTop=scroll;}});document.addEventListener('submit',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();requestClose();}if(e.key==='Tab'&&modal){let els=$$('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select:not(:disabled),.dialog textarea:not(:disabled),.dialog summary');let first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#dialog-title'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});}
function appUrl(id=''){let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('mode','app');if(id)u.searchParams.set('scenario',id);return u.href;}
function boardMode(){let active=SCENARIOS[0],device=[800,480],filter='',kind='';let devices=[['Tauleta 800 × 480',800,480],['Tauleta 1024 × 600',1024,600],['Mòbil 390 × 780',390,780],['Mòbil 360 × 780',360,780]];const groups=[...new Set(SCENARIOS.map(x=>x.group))];
 $('#root').innerHTML=`<div class="board"><header class="board-top"><div class="wordmark">menú<span>.</span> familiar</div><span class="small">Disseny UX · especificació visual V1</span><div class="spacer"></div><a class="primary" href="${esc(appUrl())}" target="_blank" rel="noopener">Obre el prototip lliure ↗</a></header><main class="board-wrap"><section class="board-intro"><div><div class="eyebrow">Disseny de producte / Revisió</div><h1>Un menú. Tots els estats.</h1><p>Prototip navegable amb dades fictícies. Selecciona un estat, prova el recorregut i comprova’l en diferents dispositius. No hi ha cap connexió amb el servidor ni dades familiars reals.</p></div><div class="board-metrics"><div class="metric"><strong>${SCENARIOS.length}</strong><span>estats</span></div><div class="metric"><strong>30</strong><span>casos d’ús</span></div><div class="metric"><strong>7</strong><span>funcionalitats</span></div></div></section><div class="review-layout"><aside class="navigator"><div class="navigator-head"><h2>Índex de pantalles</h2><input id="board-search" aria-label="Cerca un estat" placeholder="Cerca un estat o un codi"><select id="board-kind" aria-label="Tipus d’estat"><option value="">Tots els estats</option>${[...new Set(SCENARIOS.map(s=>s.kind))].map(k=>`<option>${esc(k)}</option>`).join('')}</select></div><div class="scenario-list" id="scenario-list"></div></aside><section class="review-pane"><div class="review-header" id="review-header"></div><div class="stage" id="stage"><div class="device-holder" id="holder"><iframe id="preview" title="Prototip interactiu" ></iframe></div><p class="board-note">La previsualització conserva la mida CSS del dispositiu; s’escala només per encabir-la aquí. Els canvis són simulats en memòria.</p></div></section></div><section class="wall-panel"><h2>Mural visual</h2><p class="small" style="margin-bottom:14px">Obre un grup per veure totes les seves maquetes alhora. Cada miniatura correspon a un estat independent i es pot obrir al visor interactiu.</p>${groups.map(g=>`<details class="wall-group" data-wall="${esc(g)}"><summary>${esc(g)} · ${SCENARIOS.filter(s=>s.group===g).length} estats</summary><div class="wall-grid"></div></details>`).join('')}</section><details class="matrix-panel"><summary>Matriu completa d’estats i recorreguts</summary><div class="matrix-list">${SCENARIOS.map(s=>`<button class="matrix-card" data-scenario="${s.id}"><span class="small">${s.id} · ${esc(s.group)} · ${esc(s.kind)}</span><strong>${esc(s.title)}</strong><small>${esc(s.steps)}</small><small>${s.ucs.join(' · ')}</small></button>`).join('')}</div></details><p class="board-foot">Referència UX del menú familiar V1. Els controls de revisió i els estats d’error injectats no formen part del producte. El prototip no implementa persistència, transaccions, xarxa ni el backend de Django. Els casos d’ús i les regles aprovades de <code>docs/specs/</code> prevalen en cas de discrepància.</p></main></div>`;
 function list(){let q=filter.toLocaleLowerCase('ca').trim();let matches=SCENARIOS.filter(s=>(!kind||s.kind===kind)&&(!q||[s.id,s.title,s.group,s.kind,s.ucs.join(' ')].join(' ').toLocaleLowerCase('ca').includes(q)));$('#scenario-list').innerHTML=groups.map(g=>{let rows=matches.filter(x=>x.group===g);return rows.length?`<div class="scenario-group">${esc(g)}</div>${rows.map(s=>`<button class="scenario-button ${s.id===active.id?'active':''}" data-scenario="${s.id}" ${s.id===active.id?'aria-current="true"':''}><span class="sid">${s.id}</span><span>${esc(s.title)}<small class="kind">${esc(s.kind)}</small></span></button>`).join('')}`:''}).join('')||'<p class="small" style="padding:12px">No s’han trobat estats.</p>';}
 function head(){let i=SCENARIOS.indexOf(active);$('#review-header').innerHTML=`<div class="row between"><div class="row"><span class="pill">${active.id}</span><span class="small">${esc(active.group)} · ${esc(active.kind)}</span></div><div class="row">${`<button data-board="prev" ${i===0?'disabled':''} aria-label="Estat anterior">‹</button>`}<span class="small">${i+1} / ${SCENARIOS.length}</span><button data-board="next" ${i===SCENARIOS.length-1?'disabled':''} aria-label="Estat següent">›</button></div></div><h2>${esc(active.title)}</h2><p>${esc(active.steps)}</p><p class="small">${active.ucs.join(' · ')}</p><div class="row between"><div class="row device-switch">${devices.map(([t,w,h],i)=>`<button class="${device[0]===w&&device[1]===h?'active':''}" data-device="${i}">${t}</button>`).join('')}</div><div class="row"><button data-board="reset" class="quiet">Reinicia l’estat</button><a href="${esc(appUrl(active.id))}" target="_blank" rel="noopener">Obre a mida real ↗</a></div></div>`;}
 function size(){let stage=$('#stage'),holder=$('#holder'),iframe=$('#preview');let scale=Math.min(1,Math.max(.15,(stage.clientWidth-24)/device[0]));holder.style.width=(device[0]*scale+4)+'px';holder.style.height=(device[1]*scale+4)+'px';iframe.style.width=device[0]+'px';iframe.style.height=device[1]+'px';iframe.style.transform=`scale(${scale})`;}
 function choose(id,scroll=false){let s=SCENARIOS.find(x=>x.id===id);if(!s)return;active=s;if(s.id==='M02')device=[390,780];loadPreview(s.id);head();list();size();if(scroll)$('#review-header').scrollIntoView({block:'start'});}
 function previewSource(id){const marker='/*ENTRY_POINT*/';let at=PROTOTYPE_SOURCE.lastIndexOf(marker);return '<!doctype html>'+PROTOTYPE_SOURCE.slice(0,at)+`appMode(${JSON.stringify(id)});`+PROTOTYPE_SOURCE.slice(PROTOTYPE_SOURCE.indexOf('</'+'script>',at));}
 function loadPreview(id){$('#preview').srcdoc=previewSource(id);}
 function wallSize(card){let holder=card.querySelector('.wall-device'),ifr=holder.querySelector('iframe'),w=Number(holder.dataset.w),h=Number(holder.dataset.h),scale=Math.min(1,(card.clientWidth-20)/w);holder.style.width=(w*scale)+'px';holder.style.height=(h*scale)+'px';ifr.style.width=w+'px';ifr.style.height=h+'px';ifr.style.transform=`scale(${scale})`;}
 $$('.wall-group').forEach(d=>d.addEventListener('toggle',()=>{let grid=d.querySelector('.wall-grid');if(!d.open){grid.innerHTML='';return;}grid.innerHTML=SCENARIOS.filter(s=>s.group===d.dataset.wall).map(s=>{let tablet=(s.id.startsWith('M')&&s.id!=='M02')||s.id.startsWith('T')||['S06','S07','S08','S10','S11','S12','C01','C09','C12'].includes(s.id);let w=tablet?800:390,h=tablet?480:780;return `<article class="wall-card"><header><span class="small">${s.id} · ${esc(s.kind)} · ${w} × ${h}</span><strong>${esc(s.title)}</strong></header><div class="wall-thumb"><div class="wall-device" data-w="${w}" data-h="${h}"><iframe title="${esc(s.title)}" data-wall-frame="${s.id}" tabindex="-1" aria-hidden="true"></iframe></div></div><footer><p class="small">${esc(s.steps)}</p><button data-scenario="${s.id}" class="wall-open">Obre l’estat</button></footer></article>`;}).join('');grid.querySelectorAll('.wall-card').forEach(card=>{wallSize(card);let ifr=card.querySelector('iframe');ifr.srcdoc=previewSource(ifr.dataset.wallFrame);});}));
 window.addEventListener('resize',()=>$$('.wall-card').forEach(wallSize));
 list();head();size();loadPreview(active.id);window.addEventListener('resize',size);if(typeof ResizeObserver!=='undefined')new ResizeObserver(size).observe($('#stage'));$('#board-search').addEventListener('input',e=>{filter=e.target.value;list()});$('#board-kind').addEventListener('change',e=>{kind=e.target.value;list()});document.addEventListener('click',e=>{let b=e.target.closest('[data-scenario],[data-device],[data-board]');if(!b||b.disabled)return;if(b.dataset.scenario)choose(b.dataset.scenario,b.classList.contains('matrix-card')||b.classList.contains('wall-open'));else if(b.dataset.device!==undefined){let d=devices[Number(b.dataset.device)];device=[d[1],d[2]];head();size();}else if(b.dataset.board==='reset')loadPreview(active.id);else {let i=SCENARIOS.indexOf(active)+(b.dataset.board==='next'?1:-1);if(SCENARIOS[i])choose(SCENARIOS[i].id);}});
}
const PROTOTYPE_SOURCE=document.documentElement.outerHTML;
/*ENTRY_POINT*/const urlParams=new URLSearchParams(location.search);if(urlParams.get('mode')==='app')appMode(urlParams.get('scenario'));else boardMode();
</script></body></html>
