services:
  menu-familiar:
    image: ${MENU_IMAGE:?Set MENU_IMAGE to the verified candidate}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_DB_PATH: /data/menu.sqlite3
    ports:
      - "${MENU_BIND_ADDRESS:?Set MENU_BIND_ADDRESS}:${MENU_PORT:?Set MENU_PORT}:8000"
    volumes:
      - "${MENU_DATA_DIR:?Set MENU_DATA_DIR}:/data"
    restart: unless-stopped
