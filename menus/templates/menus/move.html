{% extends "menus/base.html" %}{% block content %}<h1>Tria la destinació</h1>{% for target_day, label, target_meal, meal_label, slot in choices %}<form method="post" action="{% if slot.state == "selected" %}{% url 'move_action' week|date:'Y-m-d' 'exchange' %}{% else %}{% url 'move_action' week|date:'Y-m-d' 'move' %}{% endif %}">{% csrf_token %}<input type="hidden" name="version" value="{{ menu.version }}"><input type="hidden" name="source_day" value="{{ day }}"><input type="hidden" name="source_meal" value="{{ meal }}"><input type="hidden" name="destination_day" value="{{ target_day }}"><input type="hidden" name="destination_meal" value="{{ target_meal }}">{% if slot.state == 'skipped' %}<label><input type="checkbox" name="confirm" value="yes">Aquest àpat està omès. Vols substituir l’omissió?</label>{% endif %}<button>{{ label }} · {{ meal_label }} · {% if slot.dish %}{{ slot.dish.name }}{% elif slot.state == 'skipped' %}Omès{% else %}Pendent{% endif %}</button></form>{% endfor %}<a href="{% url 'slot_detail' week|date:'Y-m-d' day meal %}">Cancel·la</a>{% endblock %}
