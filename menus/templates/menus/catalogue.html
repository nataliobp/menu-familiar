{% extends "menus/base.html" %}{% block content %}<h1>Plats</h1><a href="{% url 'dish_create' %}">Nou plat</a> · <a href="?archived={% if archived %}0{% else %}1{% endif %}">{% if archived %}Actius{% else %}Arxivats{% endif %}</a><form method="get"><input type="hidden" name="archived" value="{% if archived %}1{% else %}0{% endif %}"><label for="q">Cerca un plat</label><input id="q" name="q" value="{{ query }}"><label for="category">Categoria</label><select id="category" name="category"><option value="">Totes les categories</option>{% for key, name in categories %}<option value="{{ key }}" {% if category == key %}selected{% endif %}>{{ name }}</option>{% endfor %}</select><button>Cerca</button></form><ul>{% for dish in dishes %}<li><a href="{% url 'dish_detail' dish.id %}">{{ dish.name }}</a> · {{ dish.primary_category.name_ca }}</li>{% empty %}<li>No s’han trobat plats.</li>{% endfor %}</ul>{% endblock %}
