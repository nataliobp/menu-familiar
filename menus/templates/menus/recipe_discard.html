{% extends "menus/base.html" %}{% block content %}<h1>Descarta els canvis?</h1><p>Els canvis que no hagis desat es perdran.</p><form method="post">{% csrf_token %}<input type="hidden" name="version" value="{{ values.version }}"><input type="hidden" name="dish_id" value="{{ dish.id }}"><input type="hidden" name="preparation" value="{{ values.preparation }}">{% for line in values.lines %}<input type="hidden" name="name" value="{{ line.name|default_if_none:'' }}"><input type="hidden" name="quantity" value="{{ line.quantity|default_if_none:'' }}"><input type="hidden" name="unit" value="{{ line.unit|default_if_none:'' }}"><input type="hidden" name="note" value="{{ line.note|default_if_none:'' }}">{% if line.taste %}<input type="hidden" name="taste" value="{{ forloop.counter0 }}">{% endif %}{% endfor %}<button name="action" value="continue">Continua editant</button></form>{% if week %}<a href="{% url 'slot_detail' week|date:'Y-m-d' day meal %}">Descarta els canvis</a>{% else %}<a href="{% url 'recipe_view' dish.id %}">Descarta els canvis</a>{% endif %}{% endblock %}
