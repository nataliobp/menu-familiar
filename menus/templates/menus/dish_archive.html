{% extends "menus/base.html" %}{% block content %}<h1>{% if action == 'archive' %}Arxiva el plat{% else %}Restaura el plat{% endif %}</h1><p>{{ dish.name }}{% if action == 'archive' %}: es conservarà als menús existents.{% endif %}</p><form class="toolbar form-actions" method="post">{% csrf_token %}<input type="hidden" name="version" value="{{ dish.version }}"><input type="hidden" name="confirm" value="yes"><button class="{% if action == 'archive' %}danger{% else %}primary{% endif %}">Confirma</button></form><a class="button" href="{% url 'dish_detail' dish.id %}">Cancel·la</a>{% endblock %}
