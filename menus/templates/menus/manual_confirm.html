{% extends "menus/base.html" %}
{% block content %}
<section data-confirmation>
  <h1 data-confirm-heading>Eliminar el producte?</h1>
  <p data-confirm-description>{{ item.name }} s’eliminarà de la llista de la compra.</p>
  <form class="toolbar form-actions" method="post" action="{% url 'shopping_action' week|date:'Y-m-d' 'manual_remove' %}">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ item.id }}">
    <input type="hidden" name="menu_version" value="{{ menu_version }}">
    <input type="hidden" name="overlay_version" value="{{ overlay_version }}">
    <input type="hidden" name="confirm" value="yes">
    <a class="button" data-confirm-cancel href="{% url 'shopping_week' week|date:'Y-m-d' %}">Cancel·la</a>
    <button class="danger">Sí, elimina el producte</button>
  </form>
</section>
{% endblock %}
