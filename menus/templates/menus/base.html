<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Menú familiar{% endblock %}</title>{% load static %}<link rel="stylesheet" href="{% static 'menus/app.css' %}"></head>
<body><header><strong>Menú familiar</strong><nav><a href="{% if week %}{% url 'menu_week' week|date:'Y-m-d' %}{% else %}{% url 'current_menu' %}{% endif %}" {% if "/menu/" in request.path %}aria-current="page"{% endif %}>Menú setmanal</a> <a href="{% url 'catalogue' %}" {% if "/plats/" in request.path %}aria-current="page"{% endif %}>Plats</a> <a href="{% url 'weekly_template' %}" {% if "/plantilla/" in request.path %}aria-current="page"{% endif %}>Plantilla</a> <a href="{% if week %}{% url 'shopping_week' week|date:'Y-m-d' %}{% else %}{% url 'current_shopping' %}{% endif %}" {% if "/compra/" in request.path %}aria-current="page"{% endif %}>Llista de la compra</a></nav></header><main>{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
