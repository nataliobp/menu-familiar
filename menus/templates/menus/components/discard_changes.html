<template id="discard-edits">
  <section data-confirmation>
    <h1 data-confirm-heading>Descartar els canvis?</h1>
    <p data-confirm-description>Els canvis que no hagis desat es perdran.</p>
    <div class="toolbar form-actions">
      <button type="button" data-confirm-cancel>Continua editant</button>
      <a class="button danger" data-discard-destination href="{{ destination }}">Descarta els canvis</a>
    </div>
  </section>
</template>
